 return `<div class="panel finance"><h3>💰 Finance měsíce</h3><div class=three><div>Příjmy<br><b>${inc.toLocaleString("cs-CZ")} Kč</b></div><div>Výdaje<br><b>${exp.toLocaleString("cs-CZ")} Kč</b></div><div>Úspora<br><b>${(inc-exp).toLocaleString("cs-CZ")} Kč</b></div></div></div>`}
function saveGoal(y,m,i,v){monthData(y,m).goals[i]=v;persist()}
function prevM(){curM--;if(curM<0){curM=11;curY--}if(curY<2026){curY=2026;curM=0}monthView(curY,curM)}
function nextM(){curM++;if(curM>11){curM=0;curY++}if(curY>2027){curY=2027;curM=11}monthView(curY,curM)}
function openDay(k){let x=dayData(k),[y,mm,d]=k.split("-").map(Number);curY=y;curM=mm-1;
 let hours="";for(let hr=6;hr<=23;hr++)hours+=`<label>${String(hr).padStart(2,"0")}:00</label><input value="${esc(x.schedule[hr]||"")}" onchange="setSchedule('${k}',${hr},this.value)">`;
 $("main").innerHTML=`<button class=btn onclick="monthView(${y},${mm-1})">← Zpět na měsíc</button><div class="panel events"><h2>${d}. ${MN[mm-1]} ${y}</h2><b>👤 ${esc(getND(k))}</b>${HOL[k]?`<p>🇨🇿 ${esc(HOL[k])}</p>`:""}</div>
 <div class="panel tasks"><h3>📋 Úkoly</h3><div id=tasklist>${taskHTML(k,x)}</div><button class=btn onclick="addTask('${k}')">+ Přidat úkol</button></div>
 <div class=cols><div class=panel><h3>🕐 Program dne</h3><div class=schedule>${hours}</div></div><div><div class="panel notes"><h3>📝 Denní poznámky</h3><textarea onchange="setField('${k}','note',this.value)">${esc(x.note)}</textarea></div>
 <div class="panel finance"><h3>💰 Finance dne</h3><label>Příjmy<input type=number value="${x.income||""}" onchange="setField('${k}','income',this.value)"></label><label>Výdaje<input type=number value="${x.expense||""}" onchange="setField('${k}','expense',this.value)"></label><p>Úspora: <b>${((+x.income||0)-(+x.expense||0)).toLocaleString("cs-CZ")} Kč</b></p><textarea placeholder="Poznámka k financím" onchange="setField('${k}','financeNote',this.value)">${esc(x.financeNote)}</textarea></div></div></div>`}
function taskHTML(k,x){return x.tasks.map((t,i)=>`<div class="row priority-${t.priority||2}"><input type=checkbox ${t.done?"checked":""} onchange="taskSet('${k}',${i},'done',this.checked)"><input value="${esc(t.text)}" placeholder="Název úkolu" onchange="taskSet('${k}',${i},'text',this.value)"><select onchange="taskSet('${k}',${i},'priority',+this.value)"><option value=1 ${t.priority==1?"selected":""}>⭐ Vysoká</option><option value=2 ${!t.priority||t.priority==2?"selected":""}>⭐ Střední</option><option value=3 ${t.priority==3?"selected":""}>⭐ Nízká</option></select><select class=tag onchange="taskSet('${k}',${i},'tag',this.value)"><option value="">bez značky</option>${["důležité","zavolat","zařídit","koupit"].map(a=>`<option ${t.tag==a?"selected":""}>${a}</option>`).join("")}</select><button class="btn del" onclick="delTask('${k}',${i})">×</button></div>`).join("")}
function addTask(k){dayData(k).tasks.push({text:"",done:false,priority:2,tag:""});persist();openDay(k)}
function taskSet(k,i,f,v){dayData(k).tasks[i][f]=v;persist()}
function delTask(k,i){dayData(k).tasks.splice(i,1);persist();openDay(k)}
function setSchedule(k,h,v){dayData(k).schedule[h]=v;persist()}
function setField(k,f,v){dayData(k)[f]=v;persist();if(f=="income"||f=="expense")openDay(k)}
function yearView(){let h=`<div class=panel><h2>📆 Rok</h2><div class=three>`;for(let y of [2026,2027])for(let m=0;m<12;m++)h+=`<button class=btn onclick="monthView(${y},${m})">${MN[m]} ${y}</button>`;$("main").innerHTML=h+"</div></div>"}
function statsView(){let total=done=inc=exp=0,tags={};Object.values(db.days).forEach(x=>{(x.tasks||[]).forEach(t=>{if(t.text){total++;if(t.done)done++;if(t.tag)tags[t.tag]=(tags[t.tag]||0)+1}});inc+=+x.income||0;exp+=+x.expense||0});
 $("main").innerHTML=`<div class=panel><h2>📊 Statistiky 2026/2027</h2><div class=stats><div class=stat><div class=big>${total}</div>úkolů</div><div class=stat><div class=big>${done}</div>splněno</div><div class=stat><div class=big>${total?Math.round(done/total*100):0}%</div>úspěšnost</div><div class=stat><div class=big>${(inc-exp).toLocaleString("cs-CZ")}</div>úspora Kč</div></div><p>Příjmy: <b>${inc.toLocaleString("cs-CZ")} Kč</b> · Výdaje: <b>${exp.toLocaleString("cs-CZ")} Kč</b></p><p>${Object.entries(tags).map(([a,n])=>`${a}: <b>${n}</b>`).join(" · ")}</p></div>`}
function colors(){$("modal").style.display="flex";$("modalBody").innerHTML=`<h3>🎨 Vlastní barvy</h3>${["bg","paper","tasks","notes","events","finance","accent"].map(a=>`<label>${a}<input type=color id="c_${a}" value="${db.colors[a]||getComputedStyle(document.documentElement).getPropertyValue("--"+a).trim()}"></label>`).join("")}<p><button class="btn primary" onclick="saveColors()">Uložit barvy</button> <button class=btn onclick="closeModal()">Zavřít</button></p>`}
function saveColors(){["bg","paper","tasks","notes","events","finance","accent"].forEach(a=>db.colors[a]=$("c_"+a).value);persist();applyColors();closeModal()}
function applyColors(){Object.entries(db.colors||{}).forEach(([a,v])=>document.documentElement.style.setProperty("--"+a,v))}
function closeModal(){$("modal").style.display="none"}
function more(){$("modal").style.display="flex";$("modalBody").innerHTML=`<h3>Více</h3><button class=btn onclick="colors()">🎨 Barvy</button>
<button class="btn" id="mobileInstallBtn" onclick="installPWA()">📲 Instalovat aplikaci</button>
<button class="btn primary" onclick="exportGPT()">📤 Export do ChatGPT</button><p><button class=btn onclick="closeModal()">Zavřít</button></p>`}
function exportGPT(){let txt=`DIÁŘ 2026/2027\n\n`+Object.keys(db.days).sort().map(k=>{let x=db.days[k],ts=(x.tasks||[]).filter(t=>t.text).map(t=>`- [${t.done?"x":" "}] ${t.text} | priorita ${t.priority||2}${t.tag?" | "+t.tag:""}`).join("\n");return `${k} – ${getND(k)}${HOL[k]?" – "+HOL[k]:""}\n${ts}\nPoznámka: ${x.note||""}\nPříjem: ${x.income||0}, výdaj: ${x.expense||0}, finance: ${x.financeNote||""}`}).join("\n\n");
 navigator.clipboard?.writeText(txt);window.open("https://chatgpt.com/","_blank");alert("Diář byl připraven a zkopírován do schránky. Vložte jej do ChatGPT pomocí Ctrl+V.") }

function showTasks(){
 let rows=[];
 Object.keys(db.days).sort().forEach(k=>(db.days[k].tasks||[]).forEach((t,i)=>{if(t.text)rows.push(`<div class="row priority-${t.priority||2}"><input type=checkbox ${t.done?"checked":""} onchange="taskSet('${k}',${i},'done',this.checked);showTasks()"><div><b>${esc(t.text)}</b><br><small>${k}${t.tag?" · "+esc(t.tag):""}</small></div><span>⭐ ${t.priority||2}</span><button class=btn onclick="openDay('${k}')">Otevřít</button></div>`)}));
 $("main").innerHTML=`<div class="panel tasks"><h2>✓ Všechny úkoly</h2>${rows.length?rows.join(""):"<p>Zatím nejsou žádné úkoly.</p>"}</div>`;
}
function showSchedule(){
 let rows=[];Object.keys(db.days).sort().forEach(k=>{let sch=db.days[k].schedule||{};Object.keys(sch).sort((a,b)=>a-b).forEach(h=>{if(sch[h])rows.push(`<div class=panel style="margin:7px 0"><b>${k} · ${String(h).padStart(2,"0")}:00</b><br>${esc(sch[h])}</div>`)})});
 $("main").innerHTML=`<div class=panel><h2>◷ Program</h2>${rows.length?rows.join(""):"<p>V programu zatím nic není.</p>"}</div>`;
}
function showGoals(){
 let rows=[];for(let y of [2026,2027])for(let m=0;m<12;m++){let md=monthData(y,m),g=md.goals.filter(Boolean);if(g.length)rows.push(`<div class=panel><h3>${MN[m]} ${y}</h3>${g.map((x,i)=>`<p>🎯 ${esc(x)}</p>`).join("")}<button class=btn onclick="monthView(${y},${m})">Otevřít měsíc</button></div>`)}
 $("main").innerHTML=`<div class=panel><h2>◎ Hlavní cíle</h2>${rows.length?rows.join(""):"<p>Zatím nejsou zadané žádné měsíční cíle.</p>"}</div>`;
}
function showFinance(){
 let h=`<div class="panel finance"><h2>💰 Finance 2026/2027</h2>`;for(let y of [2026,2027]){h+=`<h3>${y}</h3><div class=three>`;for(let m=0;m<12;m++){let pre=`${y}-${String(m+1).padStart(2,"0")}`,inc=0,exp=0;Object.entries(db.days).forEach(([k,x])=>{if(k.startsWith(pre)){inc+=+x.income||0;exp+=+x.expense||0}});h+=`<button class=btn onclick="monthView(${y},${m})"><b>${MN[m]}</b><br><small>+${inc.toLocaleString("cs-CZ")} / −${exp.toLocaleString("cs-CZ")} Kč<br>Úspora ${(inc-exp).toLocaleString("cs-CZ")} Kč</small></button>`}h+=`</div>`}$("main").innerHTML=h+"</div>";
}

function goToday(){let d=new Date();if(![2026,2027].includes(d.getFullYear())){monthView(2026,0)}else openDay(key(d.getFullYear(),d.getMonth(),d.getDate()))}
applyColors();monthView(curY,curM);

let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
 e.preventDefault();deferredInstallPrompt=e;
 ["installBtn","sideInstallBtn"].forEach(id=>{let el=document.getElementById(id);if(el)el.style.display=""});
});
async function installPWA(){
 if(deferredInstallPrompt){
   deferredInstallPrompt.prompt();
   await deferredInstallPrompt.userChoice;
   deferredInstallPrompt=null;
   ["installBtn","sideInstallBtn"].forEach(id=>{let el=document.getElementById(id);if(el)el.style.display="none"});
 }else{
   alert("Pokud se instalační nabídka nezobrazí, otevřete nabídku prohlížeče a zvolte „Přidat na plochu“ nebo „Instalovat aplikaci“. Na iPhonu použijte Sdílet → Přidat na plochu.");
 }
}
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null});
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(console.error));
}
</script></body></html>
